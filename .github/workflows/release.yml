name: Build/Release Electron App

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Assets
        run: npm run build && npx electron-builder --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Differential Updates to CDN
        # This is a hypothetical step representing the upload to your generic update server.
        # It uploads the required files for electron-updater: the .exe, latest.yml, and .blockmap
        run: |
          echo "Uploading to https://updates.taskflow.app/downloads..."
          # Example: aws s3 sync dist-electron s3://taskflow-updates/downloads --exclude "*" --include "*.exe" --include "*.yml" --include "*.blockmap"
